# ============================================================================
# Notes
# ============================================================================
#
# 1. The kernel tarball URL is reachable; we will compute its SHA256 in Phase 2
#    by actually downloading it.
# 2. PGP signature verification for the kernel uses the .tar.sign file (the
#    .tar.xz is built deterministically from the .tar; we verify .tar.sign
#    against the .tar, then compute .tar.xz's sha256 locally).
# 3. The LFS book itself does not publish a single machine-readable manifest of
#    source checksums. Per-package checksums are listed individually on each
#    package's download page. Our Phase 2 download script will fetch each URL
#    and compute SHA256 in-place, then update this file.
# 4. License fields are best-effort; full SBOM with exact license texts lands
#    in Phase 11 (release engineering).
# 5. `ftpmirror.gnu.org` may be unreachable in some sandboxed environments
#    (the Phase 0 sources-verify run reported FAIL for ftpmirror URLs in
#    one such environment). The Phase 2 download script will fall back to
#    `https://mirrors.kernel.org/gnu/` if the primary mirror fails.
