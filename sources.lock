# sources.lock — pinned source manifest for the first LFS stage.
#
# Phase 0 scope: only the kernel tarball + LFS 13.1-systemd top-of-tree
# packages are listed. Full SHA256 set will be filled in at Phase 2 entry
# after the actual download.
#
# Status legend:
#   verified   — URL reachable + SHA256 computed from downloaded tarball
#   url-ok     — URL reachable (HTTP HEAD 200); SHA256 not yet computed
#   unverified — URL not yet probed (no network at time of manifest creation)
#
# Per Project Initiation v2 §10: "Все исходники: URL, версия, SHA256 (и подпись
# upstream, где есть) в машиночитаемом манифесте". This file IS that manifest.
# Format: TOML-ish; one entry per source, fields explicit.
#
# Last verification run: 2026-10-30 (UTC+8).

# ============================================================================
# Kernel
# ============================================================================

[[sources]]
name        = "linux"
version     = "6.18.59"
url         = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.59.tar.xz"
signature   = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.59.tar.sign"
signer      = "kernel.org release maintainer (Greg Kroah-Hartman for 6.x stable)"
sign_status = "url-ok (PGP .tar.sign published by kernel.org)"
sha256      = "UNVERIFIED"   # computed in Phase 2 after download
status      = "url-ok"      # URL verified 2026-10-30 via HTTP HEAD: 200
license     = "GPL-2.0-only WITH Linux-syscall-note"
purpose     = "Project baseline kernel per ADR-0006"

